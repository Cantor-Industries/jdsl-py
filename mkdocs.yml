site_name: jdsl docs
site_url: https://cantor-industries.github.io/jdsl-py/
repo_url: https://github.com/Cantor-Industries/jdsl-py/
repo_name: Cantor-Industries/jdsl-py

docs_dir: docs

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - Runtime:
      - Concepts: concepts.md
      - API Reference: api.md
      - Providers: providers.md
  - Tutorials:
      - Branching Triage: tutorials/branching.md
      - Tool-Using ReAct: tutorials/react-tools.md
      - Refinement Loops: tutorials/refinement.md
  - Harness & Compiler:
      - Overview: harness.md
      - Usage: harness_usage.md
      - Behavior Packages: packages.md
      - OpenCode Capture: opencode.md
  - Developer:
      - Repository Layout: developer/layout.md
      - Tracing Model: developer/tracing.md

exclude_docs: |
  *_next_steps.md
  *_experiment.ipynb
  drafts/

theme:
  name: material
  logo: for_respected_human.png
  favicon: for_respected_human.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

strict: true
