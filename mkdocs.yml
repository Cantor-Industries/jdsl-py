site_name: jdsl docs
site_url: https://cantor-industries.github.io/jdsl-py/
repo_url: https://github.com/Cantor-Industries/jdsl-py/
repo_name: Cantor-Industries/jdsl-py

docs_dir: docs
use_directory_urls: false

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - CLI: cli.md
  - Runtime:
      - Concepts: concepts.md
      - API Reference: api.md
      - Providers: providers.md
  - Code Walkthrough:
      - Authoring Surface: code/authoring.md
      - Runtime Interpreter: code/runtime.md
      - Trace and Capture: code/tracing.md
      - Package Runtime: code/packages.md
  - Tutorials:
      - Branching Triage: tutorials/branching.md
      - Tool-Using ReAct: tutorials/react-tools.md
      - Refinement Loops: tutorials/refinement.md
  - Harness & Compiler:
      - Overview: harness.md
      - Compiler Pipeline: compiler.md
      - Usage: harness_usage.md
      - Behavior Packages: packages.md
      - Plugins: plugins.md
      - OpenCode Capture: opencode.md
  - Developer:
      - Repository Layout: developer/layout.md
      - Tracing Model: developer/tracing.md
      - Publishing: developer/publishing.md

exclude_docs: |
  *_next_steps.md
  *_experiment.ipynb
  drafts/

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - json
    - python
    - text
    - yaml
  include_homepage_in_sidebar: true
  navigation_depth: 4
  prev_next_buttons_location: bottom

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

strict: true
