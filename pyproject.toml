[project]
name = "jdsl"
version = "0.1.0"
description = "Declarative behavior-tree agents with DSPy-style signatures, run by a tree-walking interpreter over Claude / DeepSeek / OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Machar Kook" }]
dependencies = [
    "anthropic>=0.49",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
jdsl = "jdsl.cli:app"

[project.optional-dependencies]
# The behavior harness + compiler. Kept optional so the runtime core stays light
# (design §36). The compiler pipeline itself is pure-stdlib; these enable the live
# MCP control plane / proxy transport.
harness = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jdsl", "jdsl_harness"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# allow terse one-line bodies (`if x: return y`) — tinygrad-style density
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# examples are teaching material: allow lambdas, unused demo vars, print-driven flow
"examples/*" = ["E731", "B007", "F841"]
# typer's API *requires* Argument()/Option() calls in parameter defaults
"jdsl/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["test"]
timeout = 60
addopts = "-q"
